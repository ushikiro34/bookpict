spring:
  application:
    name: bookpict

  # ✅ H2 데이터베이스 - 파일 기반 (재시작 시에도 데이터 유지)
  datasource:
    url: jdbc:h2:file:./data/bookpict;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false  # 보안을 위해 로컬만 접근 허용

  jpa:
    hibernate:
      # ✅ update: 기존 데이터 유지하면서 스키마 변경만 적용
      # create: 매번 테이블 삭제 후 재생성 (개발 초기에만 사용)
      # create-drop: 애플리케이션 종료 시 테이블 삭제
      # validate: 스키마 검증만 (프로덕션 권장)
      ddl-auto: update
      
    show-sql: false  # SQL 로그를 보려면 true로 변경
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
        # ✅ 배치 최적화
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ✅ 세션 관리
  session:
    store-type: none
    timeout: 30m

# ✅ 알라딘 API 설정
aladin:
  api:
    key: ${ALADIN_API_KEY:ttbushikiro0222001}
    base-url: http://www.aladin.co.kr/ttb/api

# ✅ 로깅 설정
logging:
  level:
    root: INFO
    edu.bookpict: DEBUG
    edu.bookpict.aladin.scheduler: INFO  # 스케줄러 로그
    edu.bookpict.aladin.service: INFO    # Aladin 서비스 로그
    org.hibernate.SQL: WARN              # SQL 로그 (필요시 DEBUG)
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: INFO
    org.springframework.scheduling: INFO  # 스케줄링 로그

  # ✅ 로그 파일 저장
  file:
    name: logs/bookpict.log
    max-size: 10MB
    max-history: 30

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ✅ 서버 설정
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: on_param
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# ✅ 스케줄러 설정
spring.task.scheduling:
  pool:
    size: 2  # 동시 실행 가능한 스케줄 작업 수
  thread-name-prefix: scheduler-

---
# ✅ 프로덕션 프로파일 (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/bookpict
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    edu.bookpict: INFO
    org.hibernate.SQL: WARN
