spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  session:
    store-type: none

aladin:
  api:
    key: test-key
    base-url: http://www.aladin.co.kr/ttb/api

logging:
  level:
    root: WARN
    edu.bookpict: INFO
