spring:
  application:
    name: bookpict

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

aladin:
  api:
    key: ${ALADIN_API_KEY}
    base-url: http://www.aladin.co.kr/ttb/api

admin:
  user: ${ADMIN_USER:admin}
  password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    root: INFO
    edu.bookpict: INFO
